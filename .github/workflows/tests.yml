name: Testes

on:
  push:
  pull_request:

jobs:
  pytest:
    name: ${{ matrix.ficheiro }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false        # se um ficheiro falhar, os outros continuam a correr
      matrix:
        ficheiro:
          - test_geometria
          - test_genome
          - test_brain
          - test_creature
          - test_world
          - test_state_box
          - test_main
          #- test_simulacao

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Correr ${{ matrix.ficheiro }}
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m pytest -v tests/${{ matrix.ficheiro }}.py
